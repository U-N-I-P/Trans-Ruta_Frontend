name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/correcion-de-errores-en-cada-modulo" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar y Verificar Tipos (TypeScript)
        run: npm run build

      # OPCIONAL: Si deseas que GitHub Actions despliegue automáticamente a Render
      # al hacer push a la rama main, puedes descomentar este paso y agregar
      # el secreto RENDER_DEPLOY_HOOK_URL en la configuración de tu repositorio en GitHub.
      # - name: Disparar Despliegue en Render
      #   if: github.ref == 'refs/heads/main' && success()
      #   run: |
      #     curl -f "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
